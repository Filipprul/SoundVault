name: Python Code Quality & Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ruff yt-dlp
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Lint with Ruff (PEP8 Check)
      run: |
        # Prüft den Code auf Syntax-Fehler und PEP8-Standards
        ruff check .

    - name: Run Unit Tests
      run: |
        python -m unittest tests/test_downloader.py
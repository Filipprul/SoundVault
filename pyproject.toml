[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = [
    "E", # E / W: pycodestyle errors and warnings
    "F", # F: Pyflakes (catches undefined names, unused imports/variables)
    "W",
    "I", # I: isort (automatic import sorting)
    "UP" # UP: pyupgrade (modernizes Python syntax)
]
ignore = []
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
]

[tool.ruff.lint.isort]
known-first-party = ["soundvault"]
